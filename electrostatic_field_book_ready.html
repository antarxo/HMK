<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Εγκατάσταση ηλεκτροστατικού πεδίου · book-ready</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111822; --text:#e8eef7; --muted:#9aa8bc;
    --cardBorder:rgba(255,255,255,.10); --active:rgba(79,168,216,.18);
    --activeBorder:rgba(79,168,216,.42);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  .app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
  .top{position:relative;padding:6px 10px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--panel);border-bottom:1px solid var(--cardBorder);display:flex;justify-content:center;align-items:center;min-height:44px}
  .langSwitch{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;gap:6px;z-index:2}
  .langBtn{min-height:24px;padding:4px 8px;font-size:10px;line-height:1;border-radius:8px}
  .title{font-size:19px;font-weight:700;display:flex;gap:10px;align-items:baseline;text-align:center}
  .sub{color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}
  .main{position:relative;min-height:0}
  #stage{position:absolute;inset:0}
  canvas{display:block}
  .overlay{position:absolute;left:10px;top:56px;z-index:20;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;width:min(292px,34vw);max-height:calc(100dvh - 62px);overflow-y:auto;padding-right:3px;pointer-events:auto;scrollbar-width:thin}
  .hud{background:rgba(10,14,20,.56);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(4px);border-radius:10px;padding:5px;pointer-events:auto}
  .label{font-size:9px;color:var(--muted);margin:0 0 3px 2px;letter-spacing:.02em;text-transform:uppercase}
  .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .row.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  #modeRow,#fieldArrowRow{grid-template-columns:1fr;max-width:none;margin:0}
#modeRow button,#fieldArrowRow button{min-width:0;width:100%;font-size:10px;line-height:1.08;padding:4px 6px;min-height:26px;display:flex;align-items:center;justify-content:center;white-space:nowrap;text-align:center;margin:0 auto}
#sourceRow button{min-width:0;font-size:10px;padding:4px 6px;min-height:26px}
  .row.transport{grid-template-columns:28px 28px 36px 28px 28px;justify-content:center;gap:5px;align-items:center}
  .row.transport button{width:100%;height:26px;min-height:26px;padding:0;font-size:13px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .navDock{display:flex;gap:6px;align-items:center;justify-content:center;width:100%}
  .statPad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:38px;min-height:56px}
  .statPad button{width:19px;height:13px;min-height:13px;padding:0;font-size:9px;line-height:1;border-radius:6px}
  .statReadout{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;min-height:20px;padding:1px 2px;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:rgba(255,255,255,.05);font-size:9px;font-weight:700;line-height:1.0}
  .statReadout .mini{font-size:7px;color:var(--muted);font-weight:600}
  .dpad{display:grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(3,22px);gap:2px;justify-content:center;align-items:center}
  .dpad button,.centerDot{padding:0;border-radius:6px;font-size:10px;font-weight:700;min-height:22px}
  .centerDot{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
  button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text);padding:4px 6px;border-radius:8px;cursor:pointer;font-size:10px;line-height:1.08;min-height:25px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden}
  button:hover{background:rgba(255,255,255,.10)}
  button.active{background:var(--active);border-color:var(--activeBorder);color:#e7f6ff}
  button:disabled{cursor:not-allowed;opacity:.48}
  button.active:disabled{opacity:.84;background:var(--active);border-color:var(--activeBorder);color:#e7f6ff}
  input[type="range"]{width:120px}
  .readout{font-size:11px;color:var(--muted);min-width:54px;text-align:right}
  .note{position:relative;right:auto;top:auto;z-index:auto;max-width:none;background:rgba(10,14,20,.42);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(4px);border-radius:10px;padding:5px 6px;color:var(--muted);font-size:9px;line-height:1.12;pointer-events:auto}
  .note b{color:var(--text)}
  .stackTwo{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .primary button{min-height:25px}
  .transportMain button{width:100%;height:26px}
  .transportMain #btnPlay{width:100%;font-size:14px}
  .row.monoRealMove{grid-template-columns:1fr;margin-top:5px}
  #btnMonoRealMove{width:100%;min-height:25px;font-size:10px}
  .auxHud .navDock{justify-content:space-between}
  #etGraphWrap{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
  #etGraph{width:100%;height:100%;display:block;background:transparent}
  .hint{display:none}
  .overlay::-webkit-scrollbar{width:6px}
  .overlay::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:999px}
  @media (max-width:860px){
    .overlay{left:8px;right:8px;top:54px;width:auto;max-height:calc(100dvh - 60px)}
    .stackTwo{grid-template-columns:1fr}
  }

  body.bookMode .top{min-height:36px;padding:4px 8px}
  body.bookMode .title{font-size:15px}
  body.bookMode .langSwitch{display:none}
  body.bookMode .overlay{top:42px;width:min(260px,38vw);max-height:calc(100dvh - 46px)}
  body.bookMode .note, body.bookMode .auxHud{display:none!important}
  body.bookMode .hud{padding:4px;border-radius:9px}
  body.bookMode button{min-height:24px;font-size:9.5px;padding:3px 5px}
  body.bookMode .row.transport button{height:24px;min-height:24px}
  body.bookMode .label{font-size:8.5px;margin-bottom:2px}


  /* Book embedding: compact bottom dock, centered scene, low visual weight. */
  body.bookMode .app{grid-template-rows:1fr;height:100dvh}
  body.bookMode .top{display:none!important}
  body.bookMode .main{position:relative;min-height:0}
  body.bookMode .overlay{
    left:6px;right:6px;top:auto;bottom:5px;width:auto;max-height:none;
    display:grid;grid-template-columns:0.95fr 0.90fr 1.12fr;gap:4px;
    padding:0;overflow:visible;align-items:stretch;pointer-events:auto;
  }
  body.bookMode .overlay>.note,
  body.bookMode .overlay>.auxHud{display:none!important}
  body.bookMode .hud{
    background:rgba(8,12,18,.58);border-color:rgba(255,255,255,.12);
    backdrop-filter:blur(4px);border-radius:8px;padding:3px;
  }
  body.bookMode .label{display:none!important}
  body.bookMode .stackTwo{display:grid;grid-template-columns:1fr;gap:4px}
  body.bookMode .row{gap:3px}
  body.bookMode #sourceRow{grid-template-columns:repeat(3,1fr)}
  body.bookMode #sourceRow button,
  body.bookMode #modeRow button,
  body.bookMode #fieldArrowRow button{
    min-height:21px;height:21px;font-size:8.5px;padding:1px 4px;border-radius:7px;line-height:1;
  }
  body.bookMode .row.transport{grid-template-columns:24px 24px 30px 24px 24px;gap:3px;justify-content:center}
  body.bookMode .row.transport button{height:22px;min-height:22px;font-size:11px;border-radius:7px;padding:0}
  body.bookMode .row.transport #btnPlay{font-size:12px}
  body.bookMode .row.monoRealMove{margin-top:3px}
  body.bookMode #btnMonoRealMove{min-height:19px;height:19px;font-size:8px;padding:1px 4px;border-radius:7px}
  body.bookMode button{box-shadow:none}
  body.bookMode #etGraphWrap{bottom:54px}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="langSwitch">
      <button id="langEl" class="langBtn active" title="Ελληνικά">GR</button>
      <button id="langEn" class="langBtn" title="English">EN</button>
    </div>
    <div class="title" id="appTitle">Εγκατάσταση ηλεκτροστατικού πεδίου</div>
  </div>
  <div class="main">
    <div id="stage"></div>
    <div id="etGraphWrap"><canvas id="etGraph"></canvas></div>
    <div class="overlay">
      <div class="note" id="note"></div>
      <div class="hud primary">
        <div class="label" id="labelSource">Πηγή του ηλεκτροστατικού πεδίου</div>
        <div class="row" id="sourceRow">
          <button data-source="plus">+q</button>
          <button data-source="minus">-q</button>
          <button data-source="dipole" id="sourceDipole">+ / -</button>
        </div>
      </div>
      <div class="stackTwo">
        <div class="hud primary">
          <div class="label" id="labelMode">Κατάσταση φορτίων</div>
          <div class="row" id="modeRow">
            <button id="modeToggle">Εμφάνιση</button>
          </div>
        </div>
        <div class="hud primary">
          <div class="label" id="labelFieldArrows">Βέλη έντασης στον +x</div>
          <div class="row" id="fieldArrowRow">
            <button id="fieldArrowsToggle">Εμφάνιση</button>
          </div>
        </div>
      </div>
      <div class="hud primary">
        <div class="label" id="labelControls">Χειρισμοί</div>
        <div class="row transport transportMain">
          <button id="btnStart" title="Αρχή">|◀</button>
          <button id="btnBack" title="Βήμα πίσω">⏴</button>
          <button id="btnPlay" title="Αναπαραγωγή / Παύση">▶</button>
          <button id="btnFwd" title="Βήμα μπροστά">⏵</button>
          <button id="btnEnd" title="Τέλος">▶|</button>
        </div>
        <div class="row monoRealMove">
          <button id="btnMonoRealMove" title="Μία πραγματική αιτιακή κίνηση μονού φορτίου">Πραγματική κίνηση τώρα</button>
        </div>
      </div>
      <div class="hud auxHud">
        <div class="label">Zoom · Speed · Camera</div>
        <div class="navDock">
          <div class="statPad">
            <button id="zoomIn" title="Zoom in">▲</button>
            <div class="statReadout"><span class="mini" id="zoomMini">Zoom</span><span class="val" id="zoomVal">100%</span></div>
            <button id="zoomOut" title="Zoom out">▼</button>
          </div>
          <div class="statPad">
            <button id="speedUp" title="Faster">▲</button>
            <div class="statReadout"><span class="mini" id="speedMini">Ταχ/τα</span><span class="val" id="speedVal">0.0080×</span></div>
            <button id="speedDown" title="Slower">▼</button>
          </div>
          <div class="dpad">
            <div></div><button id="camUp">▲</button><div></div>
            <button id="camLeft">◀</button><div class="centerDot" id="camReset">•</div><button id="camRight">▶</button>
            <div></div><button id="camDown">▼</button><div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js';

const stage = document.getElementById('stage');
const note = document.getElementById('note');
const ui = {
  appTitle: document.getElementById('appTitle'),
  labelControls: document.getElementById('labelControls'),
  labelSource: document.getElementById('labelSource'),
  labelMode: document.getElementById('labelMode'),
  labelFieldArrows: document.getElementById('labelFieldArrows'),
  sourceRow: document.getElementById('sourceRow'),
  modeRow: document.getElementById('modeRow'),
  fieldArrowRow: document.getElementById('fieldArrowRow'),
  viewRow: document.getElementById('viewRow'),
  btnPlay: document.getElementById('btnPlay'),
  btnStart: document.getElementById('btnStart'),
  btnEnd: document.getElementById('btnEnd'),
  btnBack: document.getElementById('btnBack'),
  btnFwd: document.getElementById('btnFwd'),
  btnMonoRealMove: document.getElementById('btnMonoRealMove'),
  zoomIn: document.getElementById('zoomIn'),
  zoomOut: document.getElementById('zoomOut'),
  zoomVal: document.getElementById('zoomVal'),
  zoomMini: document.getElementById('zoomMini'),
  speedVal: document.getElementById('speedVal'),
  speedMini: document.getElementById('speedMini'),
  speedUp: document.getElementById('speedUp'),
  speedDown: document.getElementById('speedDown'),
  camLeft: document.getElementById('camLeft'),
  camRight: document.getElementById('camRight'),
  camUp: document.getElementById('camUp'),
  camDown: document.getElementById('camDown'),
  camReset: document.getElementById('camReset'),
  sourceDipole: document.getElementById('sourceDipole'),
  modeToggle: document.getElementById('modeToggle'),
  fieldArrowsToggle: document.getElementById('fieldArrowsToggle'),
  langEl: document.getElementById('langEl'),
  langEn: document.getElementById('langEn'),
  etGraphWrap: document.getElementById('etGraphWrap'),
  etGraph: document.getElementById('etGraph'),
};

const I18N = {
  el: {
    htmlLang: 'el',
    title: 'Εγκατάσταση ηλεκτροστατικού πεδίου',

    hideVectors: 'Εξαφάνιση',
    dipole: '+ / -',

    playTitle: 'Αναπαραγωγή / Παύση',
    fwdTitle: 'Βήμα μπροστά',
    endTitle: 'Τέλος',
    zoomInTitle: 'Μεγέθυνση',
    zoomOutTitle: 'Σμίκρυνση',
    speedUpTitle: 'Πιο γρήγορα',
    speedDownTitle: 'Πιο αργά',
    monoRealMove: 'Πραγματική κίνηση τώρα',
    monoRealMoveTitle: 'Ξεκινά σταδιακή κίνηση του μονού φορτίου μέσα στην τρέχουσα διάδοση',
    camUpTitle: 'Πάνω',
    camDownTitle: 'Κάτω',
    camLeftTitle: 'Αριστερά',
    camRightTitle: 'Δεξιά',
    camResetTitle: 'Επαναφορά',
    langElTitle: 'Ελληνικά',
    langEnTitle: 'Αγγλικά',
    sourcePlus: 'θετικό φορτίο',
    sourceMinus: 'αρνητικό φορτίο',
    sourceDipoleText: 'δίπολο ίσων φορτίων',
    modeAppearText: 'Εμφάνιση',
    modeDisappearText: 'Εξαφάνιση',
    disappearExtra: 'Η εξαφάνιση είναι ανεξάρτητη διάδοση δίσκου στο χρώμα του φόντου πάνω από ό,τι είχε προηγηθεί. Αν ξανακληθεί Εμφάνιση ή Εξαφάνιση, ξεκινά νέο γεγονός χωρίς να σταματούν τα προηγούμενα.',
    appearDipoleExtra: 'Κάθε σημείο του χώρου ενημερώνεται μόνο όταν το φτάσει η πληροφορία από το αντίστοιχο φορτίο. Η παραμόρφωση γεννιέται μόνο μέσα στην επικάλυψη των δύο κύκλων διάδοσης. Νέα κλήση Εμφάνισης ξεκινά νέο κύμα από το μηδέν.',
    appearMonoExtra: 'Η επικράτεια του πεδίου απλώνεται προοδευτικά από την πηγή προς τα έξω. Νέα κλήση Εμφάνισης ξεκινά νέο κύμα από το μηδέν.',
    viewText: 'Μετωπική 2D τομή',
    viewExtra: 'Στη 2D θέαση οι γραμμές αναπτύσσονται μόνο στο επίπεδο xy.',
    noteTail: 'Στο δίπολο, το στιγμιαίο πεδίο υπολογίζεται ανά σημείο από τις δύο αιτιακές συνεισφορές και οι δυναμικές γραμμές χαράσσονται πάνω σε αυτό το πεδίο.'
  },
  en: {
    htmlLang: 'en',
    title: 'Establishment of Electrostatic Field',
    controls: 'Controls',
    source: 'Source of the Electrostatic Field',
    mode: 'Charge State',
    fieldArrows: 'Field arrows on +x',
    graphEt: 'E–x graph',
    appear: 'Appearance',
    disappear: 'Disappearance',
    showVectors: 'Show',
    hideVectors: 'Hide',
    dipole: '+ / -',
    zoomMini: 'Zoom',
    speedMini: 'Speed',
    startTitle: 'Start',
    backTitle: 'Step back',
    playTitle: 'Play / Pause',
    fwdTitle: 'Step forward',
    endTitle: 'End',
    zoomInTitle: 'Zoom in',
    zoomOutTitle: 'Zoom out',
    speedUpTitle: 'Faster',
    speedDownTitle: 'Slower',
    monoRealMove: 'Move charge now',
    monoRealMoveTitle: 'Start gradual causal motion of the single charge inside the current propagation',
    camUpTitle: 'Up',
    camDownTitle: 'Down',
    camLeftTitle: 'Left',
    camRightTitle: 'Right',
    camResetTitle: 'Reset',
    langElTitle: 'Greek',
    langEnTitle: 'English',
    sourcePlus: 'positive charge',

    modeAppearText: 'Appearance',
    modeDisappearText: 'Disappearance',
    disappearExtra: 'Disappearance is modeled as an independent expanding disk in the background color layered over whatever already existed. If Appearance or Disappearance is triggered again, a new event starts without stopping the previous ones.',

    viewExtra: 'In the 2D view, the lines develop only in the xy plane.',
    noteTail: 'In the dipole case, the instantaneous field is computed point by point from the two causal contributions, and the field lines are traced on that field.'

function applyLanguage(){
  const t = I18N[state.lang] || I18N.el;
  document.documentElement.lang = t.htmlLang;
  ui.appTitle.textContent = t.title;
  ui.labelControls.textContent = t.controls;
  ui.labelSource.textContent = t.source;
  ui.labelMode.textContent = t.mode;
  ui.labelFieldArrows.textContent = state.source === 'dipole' ? t.fieldArrows : t.graphEt;
  ui.sourceDipole.textContent = t.dipole;
  ui.zoomMini.textContent = t.zoomMini;
  ui.speedMini.textContent = t.speedMini;
  ui.btnStart.title = t.startTitle;
  ui.btnBack.title = t.backTitle;
  ui.btnPlay.title = t.playTitle;
  ui.btnFwd.title = t.fwdTitle;
  ui.btnEnd.title = t.endTitle;
  ui.zoomIn.title = t.zoomInTitle;
  ui.zoomOut.title = t.zoomOutTitle;
  ui.speedUp.title = t.speedUpTitle;
  ui.speedDown.title = t.speedDownTitle;
  if(ui.btnMonoRealMove){
    ui.btnMonoRealMove.textContent = document.body.classList.contains('bookMode') ? (state.lang === 'en' ? 'Move now' : 'Κίνηση τώρα') : t.monoRealMove;
    ui.btnMonoRealMove.title = t.monoRealMoveTitle;
  }
  ui.camUp.title = t.camUpTitle;
  ui.camDown.title = t.camDownTitle;
  ui.camLeft.title = t.camLeftTitle;
  ui.camRight.title = t.camRightTitle;
  ui.camReset.title = t.camResetTitle;
  ui.langEl.title = t.langElTitle;
  ui.langEn.title = t.langEnTitle;
  ui.langEl.classList.toggle('active', state.lang === 'el');
  ui.langEn.classList.toggle('active', state.lang === 'en');
}


const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x0b0f14, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
const orthoCamera = new THREE.OrthographicCamera(-6, 6, 6, -6, 0.1, 200);
const focus = new THREE.Vector3(2.0,-0.95,0);
const cameraPan = new THREE.Vector3(0,0,0);
const root = new THREE.Group();
scene.add(root);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const key1 = new THREE.DirectionalLight(0xffffff, 0.9); key1.position.set(8,10,12); scene.add(key1);
const key2 = new THREE.DirectionalLight(0x7fb0ff, 0.28); key2.position.set(-8,-5,9); scene.add(key2);

const state = {
  source:'plus',
  mode:'appear',
  view:'2d',
  lang:'el',
  playing:false,
  speed:0.0080,
  yaw:-0.72,
  pitch:0.32,
  distance:11.5,
  clock:0,
  events:[],
  showFieldArrows:true,
  fieldArrowTips:[],
  dragging:false,
  dragX:0,
  dragY:0,
  dragStartX:0,
  dragStartY:0,
  dragMoved:false,
  monoRealMotion:null,
  monoRealUiMarker:'none',
};


const qs = new URLSearchParams(window.location.search);
const qPreset = (qs.get('p') || qs.get('bookScene') || '').toLowerCase();
const BOOK_PRESETS = {
  charge: {source:'plus', mode:'appear', controls:'book', field_arrows:'off', distance:'13.8'},
  charge_appear: {source:'plus', mode:'appear', controls:'book', field_arrows:'off', distance:'13.8'},
  charge_vanish: {source:'plus', mode:'disappear', controls:'book', field_arrows:'off', distance:'13.8'},
  charge_disappear: {source:'plus', mode:'disappear', controls:'book', field_arrows:'off', distance:'13.8'},
  charge_move: {source:'plus', mode:'appear', controls:'book', field_arrows:'off', distance:'13.8'},
  plus: {source:'plus', mode:'appear', controls:'book', field_arrows:'off', distance:'13.8'},
  minus: {source:'minus', mode:'appear', controls:'book', field_arrows:'off', distance:'13.8'},

function circleDirs2D(n){
  const dirs = [];
  for(let i=0;i<n;i++){
    const t = 2 * Math.PI * i / n;
    dirs.push(new THREE.Vector3(Math.cos(t), Math.sin(t), 0));
  }
  return dirs;
}
function fibonacciDirs(n){
  const pts = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(Math.max(0, 1-y*y));
    const t = ga * i;
    pts.push(new THREE.Vector3(Math.cos(t)*r, y, Math.sin(t)*r));
  }
  return pts;
}

function fieldDipole2D(x,y){
  const dxp = x - DIPOLE_PLUS_CENTER.x, dyp = y - DIPOLE_PLUS_CENTER.y;
  const dxn = x - DIPOLE_MINUS_CENTER.x, dyn = y - DIPOLE_MINUS_CENTER.y;
  const rp = Math.pow(Math.max(1e-6, dxp*dxp + dyp*dyp), 1.5);
  const rn = Math.pow(Math.max(1e-6, dxn*dxn + dyn*dyn), 1.5);
  return {
    x: (dxp/rp) - (dxn/rn),
    y: (dyp/rp) - (dyn/rn)
  };
}

function withinSourceFront(rho){
  return rho <= renderFrontDist + 1e-9;
}
function withinSourceErase(rho){
  return rho <= Math.max(0, renderEraseDist) + 1e-9;
}
function dipoleFrontMask(center, x, y){
  return withinSourceFront(Math.hypot(x - center.x, y - center.y)) ? 1 : 0;
}
function dipoleEraseMask(center, x, y){
  return withinSourceErase(Math.hypot(x - center.x, y - center.y)) ? 1 : 0;
}
function fieldDipoleCausal2D(x, y){
  const dxp = x - DIPOLE_PLUS_CENTER.x, dyp = y - DIPOLE_PLUS_CENTER.y;
  const dxn = x - DIPOLE_MINUS_CENTER.x, dyn = y - DIPOLE_MINUS_CENTER.y;
  const rp2 = Math.max(1e-6, dxp*dxp + dyp*dyp);
  const rn2 = Math.max(1e-6, dxn*dxn + dyn*dyn);
  const rp3 = Math.pow(rp2, 1.5);
  const rn3 = Math.pow(rn2, 1.5);
  const mp = dipoleFrontMask(DIPOLE_PLUS_CENTER, x, y);
  const mn = dipoleFrontMask(DIPOLE_MINUS_CENTER, x, y);
  return {
    x: mp * (dxp / rp3) - mn * (dxn / rn3),
    y: mp * (dyp / rp3) - mn * (dyn / rn3)
  };
}
function clipStepToFrontRadius(curr, next, center, frontRadius){
  const dc = curr.distanceTo(center);
  const dn = next.distanceTo(center);
  if(dn <= frontRadius + 1e-9) return next;
  const t = THREE.MathUtils.clamp((frontRadius - dc) / Math.max(1e-9, dn - dc), 0, 1);
  return curr.clone().lerp(next, t);
}
function rk2Step2D(p, step, sign){
  const f0 = fieldDipoleCausal2D(p.x, p.y);
  const m0 = Math.hypot(f0.x, f0.y);
  if(m0 < 1e-12) return null;
  const ux0 = sign * f0.x / m0, uy0 = sign * f0.y / m0;
  const mid = new THREE.Vector3(p.x + 0.5 * step * ux0, p.y + 0.5 * step * uy0, 0);
  const f1 = fieldDipoleCausal2D(mid.x, mid.y);
  const m1 = Math.hypot(f1.x, f1.y);
  if(m1 < 1e-12) return null;
  const ux1 = sign * f1.x / m1, uy1 = sign * f1.y / m1;
  return new THREE.Vector3(p.x + step * ux1, p.y + step * uy1, 0);
}
function traceDipoleVisibleBranch(center, seedUnit, sign, otherCenter){
  const rStart = DIPOLE_SEED_EPS;
  const rEnd = Math.max(0, renderFrontDist);
  if(rEnd <= rStart + 1e-5) return null;
  const start = center.clone().add(seedUnit.clone().multiplyScalar(rStart));
  const pts = [center.clone(), start.clone()];
  let p = start.clone();
  for(let i=0;i<3200;i++){
    if(Math.abs(p.x) > DIPOLE_TRACE_BOUNDS_X || Math.abs(p.y) > DIPOLE_TRACE_BOUNDS_Y) break;
    const next = rk2Step2D(p, DIPOLE_TRACE_STEP, sign);
    if(!next) break;
    const dOwn = next.distanceTo(center);
    if(dOwn > rEnd + 1e-9){
      pts.push(clipStepToFrontRadius(p, next, center, rEnd));
      break;
    }
    pts.push(next.clone());
    p = next;
    if(next.distanceTo(otherCenter) < DIPOLE_CAPTURE_RADIUS) break;
  }
  return pts.length > 1 ? simplifyPolyline(pts, 0.016) : null;
}

function simplifyPolyline(pts, minDist){
  const out = [pts[0]];
  let last = pts[0];
  for(let i=1;i<pts.length;i++){
    const p = pts[i];
    const dx = (p.x ?? p.x) - (last.x ?? last.x);
    const dy = (p.y ?? p.y) - (last.y ?? last.y);
    const dz = ((p.z ?? 0) - (last.z ?? 0));
    if(Math.hypot(dx, dy, dz) >= minDist || i===pts.length-1){
      out.push(p.clone ? p.clone() : new THREE.Vector3(p.x, p.y, p.z || 0));
      last = p;
    }
  }
  return out;
}
function cubicBezier2D(p0, p1, p2, p3, steps=80){
  const pts = [];
  for(let i=0;i<=steps;i++) {
    const t = i/steps, mt = 1 - t;
    const x = mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x;
    const y = mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y;
    pts.push(new THREE.Vector3(x, y, 0));
  }
  return pts;
}
function buildStreamSpec(points, extra={}){
  const lengths = arcLengths(points);
  const revPoints = [...points].reverse().map(p => p.clone ? p.clone() : new THREE.Vector3(p.x,p.y,p.z||0));
  const revLengths = arcLengths(revPoints);
  return { points, lengths, totalLen:lengths[lengths.length-1], revPoints, revLengths, ...extra };
}
function integrateDipoleBranch(seed, directionSign){
  const pts = [new THREE.Vector3(seed.x, seed.y, 0)];
  let x = seed.x, y = seed.y;
  for(let i=0;i<2400;i++){
    if(Math.abs(x) > 5.6 || Math.abs(y) > 4.6) break;
    const f = fieldDipole2D(x, y);
    const m = Math.hypot(f.x, f.y);
    if(m < 1e-9) break;
    const step = 0.038;
    x += directionSign * step * f.x / m;
    y += directionSign * step * f.y / m;
    pts.push(new THREE.Vector3(x, y, 0));
    if(Math.abs(x) < 0.06 && Math.abs(y) < 0.02 && pts.length > 18) break;
  }
  return simplifyPolyline(pts, 0.022);
}
function closestJoinIndices(a, b){
  let bestI = 0, bestJ = 0, bestD = Infinity;
  for(let i=0;i<a.length;i++){
    const pa = a[i];
    for(let j=0;j<b.length;j++){
      const pb = b[j];
      const d = pa.distanceTo(pb);
      if(d < bestD){
        bestD = d; bestI = i; bestJ = j;
      }
    }
  }
  return { i:bestI, j:bestJ, d:bestD };
}
function buildDipoleStreamlines2D(){
  const lines = [];
  const plusCenter = DIPOLE_PLUS_CENTER.clone();
  const minusCenter = DIPOLE_MINUS_CENTER.clone();
  const axisVec = minusCenter.clone().sub(plusCenter).normalize();
  const perpVec = new THREE.Vector3(-axisVec.y, axisVec.x, 0);
  const r0 = 0.075;
  const upperAngles = [18,30,42,54,66,78,90,102,114,126,138].map(d => d * Math.PI / 180);
  const VIEW_EXT_X = 12.0;
  const VIEW_EXT_Y = 10.0;
  const STEP = 0.038;
  const MINUS_CAPTURE = 0.082;

  function integrateFromPlus(seedAngle){
    const dir = axisVec.clone().multiplyScalar(Math.cos(seedAngle)).add(perpVec.clone().multiplyScalar(Math.sin(seedAngle)));
    const pts = [plusCenter.clone()];
    let x = plusCenter.x + r0 * dir.x;
    let y = plusCenter.y + r0 * dir.y;
    pts.push(new THREE.Vector3(x, y, 0));
    for(let i=0;i<4200;i++){
      if(Math.abs(x) > VIEW_EXT_X || Math.abs(y) > VIEW_EXT_Y) break;
      const dMinus = Math.hypot(x - minusCenter.x, y - minusCenter.y);
      if(dMinus < MINUS_CAPTURE){
        pts.push(minusCenter.clone());
        break;
      }
      if(Math.hypot(x - plusCenter.x, y - plusCenter.y) < 0.055 && pts.length > 6) break;
      const f = fieldDipole2D(x, y);
      const m = Math.hypot(f.x, f.y);
      if(m < 1e-9) break;
      x += STEP * f.x / m;
      y += STEP * f.y / m;
      pts.push(new THREE.Vector3(x, y, 0));
    }
    const clean = simplifyPolyline(pts, 0.018);
    clean[0] = plusCenter.clone();
    return clean;
  }

  function mirrorAboutAxis(points){
    return points.map(p => {
      const rel = p.clone().sub(plusCenter);
      const a = axisVec.clone().multiplyScalar(rel.dot(axisVec));
      const b = perpVec.clone().multiplyScalar(rel.dot(perpVec));
      return plusCenter.clone().add(a).sub(b);
    });
  }

  for(const ang of upperAngles){
    const branchA = integrateFromPlus(ang);
    lines.push(buildStreamSpec(branchA, { arrowFromPlus:true, arrowFromMinus:true, arrowT:0.12 }));
    const branchB = mirrorAboutAxis(branchA);
    lines.push(buildStreamSpec(branchB, { arrowFromPlus:true, arrowFromMinus:true, arrowT:0.12 }));
  }
  return lines;
}

function buildDipoleLines3D(){
  const phis = [0, Math.PI/3, 2*Math.PI/3, Math.PI, 4*Math.PI/3, 5*Math.PI/3];
  const chosen = dipoleLines2D.filter((_,i)=>i%2===0).slice(0,18);
  const lines = [];
  for(const spec of chosen){
    for(const phi of phis){
      const c = Math.cos(phi), s = Math.sin(phi);
      const points = spec.points.map(p => new THREE.Vector3(p.x, p.y * c, p.y * s));
      const showArrows = Math.abs(phi) < 1e-6;
      lines.push(buildStreamSpec(points, { arrowFromPlus:showArrows, arrowFromMinus:showArrows, arrowT:spec.arrowT || 0.10 }));
    }
  }
  return lines;
}

function arcLengths(points){
  const acc = [0];
  for(let i=1;i<points.length;i++) acc[i] = acc[i-1] + points[i].distanceTo(points[i-1]);
  return acc;
}
function pointAlongDistance(points, lengths, d){
  if(d <= 0) return points[0].clone();
  const total = lengths[lengths.length-1];
  if(d >= total) return points[points.length-1].clone();
  let i = 1;
  while(i < lengths.length && lengths[i] < d) i++;
  const l0 = lengths[i-1], l1 = lengths[i];
  const a = (d - l0) / Math.max(1e-9, l1 - l0);
  return points[i-1].clone().lerp(points[i], a);
}
function subPathDistance(points, lengths, d0, d1){
  d0 = Math.max(0, d0);
  d1 = Math.max(0, d1);
  const total = lengths[lengths.length-1];
  if(d0 >= total || d1 <= d0 + 1e-5) return null;
  d1 = Math.min(total, d1);
  const out = [pointAlongDistance(points, lengths, d0)];
  for(let i=1;i<points.length-1;i++){
    if(lengths[i] > d0 && lengths[i] < d1) out.push(points[i].clone());
  }
  out.push(pointAlongDistance(points, lengths, d1));
  return out;
}
function makeLine(points, color=colors.line, opacity=0.95, renderOrder=0){

  const line = new THREE.Line(geom, mat);

  return line;
}
function makeTubePath(points, color=0x9cff57, radius=0.032, opacity=1.0, renderOrder=0){
  if(!points || points.length < 2) return null;
  const curve = new THREE.CatmullRomCurve3(points.map(p => p.clone()));
  const tubularSegments = Math.max(32, Math.min(220, points.length * 2));
  const geom = new THREE.TubeGeometry(curve, tubularSegments, radius, 8, false);
  const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity, depthWrite:false, depthTest:false});
  const mesh = new THREE.Mesh(geom, mat);
  mesh.renderOrder = renderOrder;
  return mesh;
}
function makeTextSprite(text, color='#f4f7fb', fontSize=52, scale=0.44){

function classifyDipolePoint(p){

  const mn = dipoleFrontMask(DIPOLE_MINUS_CENTER, p.x, p.y) ? 1 : 0;
  if(mp && mn) return 'overlap';

}

function splitPathByClassifier(points, classifier){
  const segments = [];
  if(!points || points.length < 2) return segments;
  let run = [points[0].clone()];
  let prevClass = classifier(points[0]);
  for(let i=1;i<points.length;i++){
    const p = points[i].clone();
    const cls = classifier(p);
    run.push(p);
    if(cls !== prevClass){
      if(run.length >= 2 && prevClass !== 'none') segments.push({ cls: prevClass, points: run.map(q => q.clone()) });
      run = [points[i-1].clone(), p.clone()];
      prevClass = cls;
    }
  }
  if(run.length >= 2 && prevClass !== 'none') segments.push({ cls: prevClass, points: run.map(q => q.clone()) });
  return segments;
}

  const segments = splitPathByClassifier(points, classifyDipolePoint);

    if(seg.cls !== 'none') fieldGroup.add(makeLine(seg.points, classColorDipole(seg.cls), opacity));
  }
  return segments;
}

function clearGroup(group){
  while(group.children.length){
    const child = group.children.pop();
    group.remove(child);
    child.traverse(obj => {
      if(obj.geometry) obj.geometry.dispose();
      if(obj.material){ if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose()); else obj.material.dispose(); }
    });
  }
}

function clearMonoRealMotion(){
  state.monoRealMotion = null;

function monoRealPropagationSpeed(){
  return Math.max(0.006, state.speed * 1.6) * maxRadius;
}
function smooth01(x){
  const u = THREE.MathUtils.clamp(x, 0, 1);
  return u * u * (3 - 2 * u);
}
function monoRealSourcePositionAtSourceTime(t){
  const motion = state.monoRealMotion;
  if(!motion) return new THREE.Vector3(0,0,0);
  const from = new THREE.Vector3(motion.from.x, motion.from.y, motion.from.z || 0);
  const to = new THREE.Vector3(motion.to.x, motion.to.y, motion.to.z || 0);
  if(t <= motion.start) return from;
  if(t >= motion.start + motion.duration) return to;
  const u = smooth01((t - motion.start) / Math.max(1e-9, motion.duration));
  return from.lerp(to, u);
}
function monoRealMotionEndTime(){
  const motion = state.monoRealMotion;
  return motion ? motion.start + motion.duration : 0;
}

function monoRealLatestDisappearAfterStop(){
  const motion = state.monoRealMotion;
  if(!motion || state.source === 'dipole') return null;
  const stopTime = monoRealMotionEndTime();
  let latest = null;
  for(const ev of state.events){
    if(ev.source !== state.source || ev.type !== 'disappear') continue;
    // In this first clean test we support disappearance only after the real motion has stopped.
    if(ev.start + 1e-9 < stopTime) continue;
    if(ev.start <= state.clock + 1e-9) latest = ev;
  }

}
function monoRealStopped(){
  return !!state.monoRealMotion && state.clock >= monoRealMotionEndTime() - 1e-9;
}
function runMonoRealMotionTest(){
  if(state.source === 'dipole') return;
  if(state.mode !== 'appear') return;
  if(state.monoRealMotion) return; // one real motion only, inside the existing propagation

  const relevantAppearEvents = state.events
    .filter(ev => ev.source === state.source && ev.type === 'appear' && ev.start <= state.clock)
    .sort((a,b) => b.start - a.start);
  const appearStart = relevantAppearEvents.length ? relevantAppearEvents[0].start : 0;

  const moveStart = state.clock;
  const from = new THREE.Vector3(0,0,0);
  const to = MONO_REAL_MOVE_TARGET.clone();
  const dist = Math.max(1e-6, from.distanceTo(to));
  const v = monoRealPropagationSpeed();
  const duration = dist / Math.max(1e-9, v * MONO_REAL_MOVE_SPEED_FRACTION);

  state.monoRealMotion = {
    source: state.source,
    appearStart,
    start: moveStart,
    duration,
    from: {x:from.x, y:from.y, z:0},
    to: {x:to.x, y:to.y, z:0}
  };

  // Important: this is an interruption of the current timeline, not a new scenario.
  // No clock reset, no event reset, no pre-installed field. The existing causal
  // installation continues, and from this exact moment the source begins to move.
  monoCharge.position.copy(from);
  state.playing = true;
  state.monoRealUiMarker = 'moving';
  applyButtons();
}
function monoCoulombFieldFromSource(point, src, source=state.source){
  const sign = source === 'minus' ? -1 : 1;
  const r = point.clone().sub(src);
  const r2 = Math.max(1e-6, r.x*r.x + r.y*r.y + r.z*r.z);
  const r3 = Math.pow(r2, 1.5);
  return r.multiplyScalar(sign / r3);
}
function monoInitialInstalledFieldAtPoint(point, sampleTime=state.clock, source=state.source){
  const motion = state.monoRealMotion;
  const v = monoRealPropagationSpeed();
  const appearStart = motion && Number.isFinite(motion.appearStart) ? motion.appearStart : 0;
  const initialSrc = motion
    ? new THREE.Vector3(motion.from.x, motion.from.y, motion.from.z || 0)
    : new THREE.Vector3(0,0,0);
  const arrival = appearStart + point.distanceTo(initialSrc) / Math.max(1e-9, v);
  if(sampleTime < arrival) return new THREE.Vector3(0,0,0);
  return monoCoulombFieldFromSource(point, initialSrc, source);
}
function monoMotionRetardedSourceTimeForPoint(point, sampleTime=state.clock){
  const motion = state.monoRealMotion;
  if(!motion) return null;
  const v = monoRealPropagationSpeed();
  const start = motion.start;
  if(sampleTime < start) return null;

  // This is the arrival test for the NEW INFORMATION, not for the old field.
  // If the information emitted at the instant motion starts has not arrived,
  // the point keeps the old field exactly as it was.
  const startSrc = new THREE.Vector3(motion.from.x, motion.from.y, motion.from.z || 0);
  const startResidual = start + point.distanceTo(startSrc) / Math.max(1e-9, v) - sampleTime;
  if(startResidual > 0) return null;

  let lo = start;
  let hi = sampleTime;
  // f(tau)=tau+|P-r_source(tau)|/c-sampleTime. For v_source < c it is monotonic,
  // so the latest reached source-state is found cleanly by bisection.
  for(let i=0; i<20; i++){
    const mid = 0.5 * (lo + hi);
    const src = monoRealSourcePositionAtSourceTime(mid);
    const f = mid + point.distanceTo(src) / Math.max(1e-9, v) - sampleTime;
    if(f > 0) hi = mid;
    else lo = mid;
  }
  return 0.5 * (lo + hi);
}
function monoMotionDeltaFieldAtPoint(point, sampleTime=state.clock, source=state.source){
  const motion = state.monoRealMotion;
  if(!motion) return new THREE.Vector3(0,0,0);
  const tau = monoMotionRetardedSourceTimeForPoint(point, sampleTime);
  if(tau === null) return new THREE.Vector3(0,0,0);

  const oldSrc = new THREE.Vector3(motion.from.x, motion.from.y, motion.from.z || 0);
  const retSrc = monoRealSourcePositionAtSourceTime(tau);

  // The moving source does not erase the old installed field. It brings the CHANGE.
  // The field at the point is: old field already there + retarded correction.
  // Correction = field from the retarded source-position minus the old-source field
  // that this correction finds at the point.
  return monoCoulombFieldFromSource(point, retSrc, source)
    .sub(monoCoulombFieldFromSource(point, oldSrc, source));
}
function monoRealFieldAtPoint(point, sampleTime=state.clock, source=state.source){
  const base = monoInitialInstalledFieldAtPoint(point, sampleTime, source);
  if(!state.monoRealMotion) return base;
  return base.add(monoMotionDeltaFieldAtPoint(point, sampleTime, source));
}
function pointInMonoRealBounds(p){
  return Math.abs(p.x) <= DIPOLE_TRACE_BOUNDS_X && Math.abs(p.y) <= DIPOLE_TRACE_BOUNDS_Y;
}
function monoRealTraceStep2D(p, step, traceSign, sampleTime=state.clock, source=state.source){
  const f0 = monoRealFieldAtPoint(p, sampleTime, source);
  const m0 = Math.hypot(f0.x, f0.y);
  if(m0 < 1e-12) return null;
  const ux0 = traceSign * f0.x / m0;
  const uy0 = traceSign * f0.y / m0;
  const mid = new THREE.Vector3(p.x + 0.5 * step * ux0, p.y + 0.5 * step * uy0, 0);
  const f1 = monoRealFieldAtPoint(mid, sampleTime, source);
  const m1 = Math.hypot(f1.x, f1.y);
  if(m1 < 1e-12) return null;
  const ux1 = traceSign * f1.x / m1;
  const uy1 = traceSign * f1.y / m1;
  return new THREE.Vector3(p.x + step * ux1, p.y + step * uy1, 0);

function monoRealHistoryLinePoint(dir, sourceTime, sampleTime){
  const v = monoRealPropagationSpeed();
  const src = monoRealSourcePositionAtSourceTime(sourceTime);
  const r = Math.max(0, (sampleTime - sourceTime) * v);
  return src.addScaledVector(dir, r);
}
function motionHistoryColorBandForTau(tau, motion){
  const end = motion.start + motion.duration;
  // White only while the charge is actually moving. After it stops, the newly
  // emitted static-field portions return to the source color: they are no longer
  // carrying a changing source-state, just the final settled source-state.
  return (tau >= motion.start && tau <= end) ? 'moving' : 'source';
}
function pushMonoHistoryRun(runs, type, pA, pB){
  if(!pointInMonoRealBounds(pA) || !pointInMonoRealBounds(pB)) return;
  const last = runs[runs.length - 1];
  if(last && last.type === type){
    const tail = last.points[last.points.length - 1];
    if(!tail || tail.distanceToSquared(pA) > 1e-10) last.points.push(pA);
    last.points.push(pB);
  } else {
    runs.push({type, points:[pA, pB]});
  }
}
function simplifyMonoHistoryRuns(runs){
  const source = [];
  const moving = [];
  for(const run of runs){
    if(run.points.length < 2) continue;
    const simplified = simplifyPolyline(run.points, MONO_REAL_STREAM_SIMPLIFY);
    if(simplified.length < 2) continue;
    if(run.type === 'moving') moving.push(simplified);
    else source.push(simplified);
  }
  return { source, moving };
}
function traceMonoRealHistoryLineSections(dir, sampleTime=state.clock){
  const motion = state.monoRealMotion;
  if(!motion) return null;
  const v = monoRealPropagationSpeed();
  const appearStart = Number.isFinite(motion.appearStart) ? motion.appearStart : 0;
  const tNow = sampleTime;
  if(tNow <= appearStart) return null;

  // History-line model. A point on the curve is:
  // source_position(sourceTime) + c*(now-sourceTime)*direction.
  // Emissions before the motion keep the source color. Emissions while the charge
  // is moving are white. Emissions after the charge has stopped return to the
  // source color, because the final state is static again.
  const minTauByRadius = tNow - maxRadius / Math.max(1e-9, v);
  const tauMin = Math.max(appearStart, minTauByRadius);
  const startR = Math.max(0.145, monoCharge.userData.radius * MONO_REAL_SEED_RADIUS_FACTOR);
  const tauNear = Math.max(tauMin, tNow - startR / Math.max(1e-9, v));
  if(tauNear < tauMin || tNow - tauMin <= 1e-9) return null;

  const taus = [];
  for(let i=0; i<=MONO_REAL_HISTORY_SAMPLES; i++){
    const u = i / MONO_REAL_HISTORY_SAMPLES;
    taus.push(tauNear + (tauMin - tauNear) * u);
  }
  const motionStart = motion.start;
  const motionEnd = motion.start + motion.duration;
  for(const b of [motionEnd, motionStart]){
    if(b > tauMin && b < tauNear) taus.push(b);
  }
  taus.sort((a,b)=>b-a);

  const runs = [];
  for(let i=0; i<taus.length-1; i++){
    const tauA = taus[i];
    const tauB = taus[i+1];
    if(Math.abs(tauA - tauB) < 1e-10) continue;
    const midTau = 0.5 * (tauA + tauB);
    const type = motionHistoryColorBandForTau(midTau, motion);
    const pA = monoRealHistoryLinePoint(dir, tauA, tNow);
    const pB = monoRealHistoryLinePoint(dir, tauB, tNow);
    pushMonoHistoryRun(runs, type, pA, pB);
  }
  if(runs.length === 0) return null;
  return simplifyMonoHistoryRuns(runs);
}
function rebuildMonoRealHistoryField(){
  state.fieldArrowTips = [];
  const signColor = state.source === 'plus' ? colors.plus : colors.minus;
  const motion = state.monoRealMotion;
  if(!motion) return;
  const v = monoRealPropagationSpeed();
  const from = new THREE.Vector3(motion.from.x, motion.from.y, motion.from.z || 0);
  const appearStart = Number.isFinite(motion.appearStart) ? motion.appearStart : 0;

  // Front of the original field installation. It is not restarted by the motion.
  const installR = Math.min(maxTravelDistance + 0.8, Math.max(0, (state.clock - appearStart) * v));
  if(installR > 1e-5){
    const pts = [];
    const n = 160;
    for(let i=0; i<=n; i++){
      const a = 2 * Math.PI * i / n;
      pts.push(new THREE.Vector3(from.x + installR * Math.cos(a), from.y + installR * Math.sin(a), 0.01));
    }
    fieldGroup.add(makeLine(pts, colors.guide, 0.30, 1));
  }

  // Front of the information that the source has started to move. Outside this
  // front, old trajectories remain exactly as before; inside it, newer emitted
  // parts appear from the moving source path.
  const moveFrontR = Math.min(maxTravelDistance + 0.8, Math.max(0, (state.clock - motion.start) * v));
  if(moveFrontR > 1e-5){
    const pts = [];
    const n = 160;
    for(let i=0; i<=n; i++){
      const a = 2 * Math.PI * i / n;
      pts.push(new THREE.Vector3(from.x + moveFrontR * Math.cos(a), from.y + moveFrontR * Math.sin(a), 0.012));
    }
    fieldGroup.add(makeLine(pts, signColor, 0.22, 2));
  }

  // History-lines: old portions are immutable. Only the portions emitted while
  // the charge is actually moving are white. After the motion stops, newly emitted
  // portions return to the charge color, marking the final static state.
  for(const dir of monoRealDirs2D){
    const sections = traceMonoRealHistoryLineSections(dir, state.clock);
    if(!sections) continue;
    let hasMoving = false;
    for(const pts of sections.source || []){
      if(pts && pts.length > 1){
        fieldGroup.add(makeLine(pts, signColor, 0.95, 4));
      }
    }
    for(const pts of sections.moving || []){
      if(pts && pts.length > 1){
        hasMoving = true;
        fieldGroup.add(makeLine(pts, MONO_REAL_MOTION_LINE_COLOR, 0.98, 5));
        addSmallArrowOnSegment(pts, 0.52, MONO_REAL_MOTION_LINE_COLOR, 0.047, fieldGroup, state.source === 'minus', 6);
      }
    }
    if(!hasMoving && sections.source && sections.source.length){
      const longest = sections.source.reduce((best, pts)=> pts.length > (best?.length || 0) ? pts : best, null);
      if(longest && longest.length > 1) addSmallArrowOnSegment(longest, 0.52, signColor, 0.045, fieldGroup, state.source === 'minus', 5);
    }
  }

  const disappearEv = monoRealLatestDisappearAfterStop();
  if(disappearEv){
    const eraseR = Math.min(maxTravelDistance + 0.8, Math.max(0, (state.clock - disappearEv.start) * v));
    const finalPos = monoRealSourcePositionAtSourceTime(monoRealMotionEndTime());
    const bubble = makeEraseBubble(finalPos, eraseR, 120);
    if(bubble) fieldGroup.add(bubble);
    if(eraseR > 1e-5){
      const pts = [];
      const n = 160;
      for(let i=0; i<=n; i++){
        const a = 2 * Math.PI * i / n;
        pts.push(new THREE.Vector3(finalPos.x + eraseR * Math.cos(a), finalPos.y + eraseR * Math.sin(a), 0.035));
      }
      fieldGroup.add(makeLine(pts, colors.guide, 0.42, 121));
    }
  }
}

function switchMode(next){
  if(state.source !== 'dipole' && state.monoRealMotion){

function findXAxisIntersections(points){

    const y0 = p0.y, y1 = p1.y;

    const a = Math.abs(denom) < 1e-9 ? 0.5 : THREE.MathUtils.clamp((0 - y0) / denom, 0, 1);

function prefixWithinRadius(points, center, radius){
  if(!points || points.length < 2) return null;
  const R = Math.max(0, radius);
  if(R <= 1e-9) return null;
  const out = [points[0].clone()];
  for(let i=1;i<points.length;i++){
    const a = points[i-1], b = points[i];
    const da = a.distanceTo(center);
    const db = b.distanceTo(center);
    if(db <= R + 1e-9){
      out.push(b.clone());
      continue;
    }
    // first crossing out of the propagation circle
    const ab = b.clone().sub(a);
    const ac = a.clone().sub(center);
    const A = ab.dot(ab);
    const B = 2 * ac.dot(ab);
    const C = ac.dot(ac) - R*R;
    const disc = Math.max(0, B*B - 4*A*C);
    let t = 0;
    if(A > 1e-12){
      const sdisc = Math.sqrt(disc);
      const t1 = (-B - sdisc) / (2*A);
      const t2 = (-B + sdisc) / (2*A);
      const cand = [t1,t2].filter(v => v >= -1e-6 && v <= 1+1e-6).sort((x,y)=>x-y);
      t = cand.length ? cand[cand.length-1] : THREE.MathUtils.clamp((R - da) / Math.max(1e-9, db - da), 0, 1);
    }
    out.push(a.clone().lerp(b, THREE.MathUtils.clamp(t,0,1)));
    break;
  }
  return out.length > 1 ? out : null;
}
function segmentWithinRadiusBand(points, center, r0, r1){
  const outer = prefixWithinRadius(points, center, r1);
  if(!outer || outer.length < 2) return null;
  if(r0 <= 1e-9) return outer;
  const inner = prefixWithinRadius(points, center, r0);
  if(!inner || inner.length < 2) return outer;
  const d0 = arcLengths(inner);
  const cut = d0[d0.length - 1];
  const d1 = arcLengths(outer);
  return subPathDistance(outer, d1, cut, d1[d1.length - 1]);
}

function rebuildField(){

  const currentEvents = state.events.filter(ev => ev.source === state.source);
  if(!currentEvents.length){ state.fieldArrowTips = []; return; }

          const plusSegments = splitPathByClassifier(plusBranch, classifyDipolePoint);
          for(const seg of plusSegments){
            if(!seg.points || seg.points.length < 2) continue;
            if(seg.cls !== 'plus' && seg.cls !== 'overlap') continue;
            const color = classColorDipole(seg.cls);

          for(const seg of minusSegments){

            const color = classColorDipole(seg.cls);
            const lineOrder = seg.cls === 'overlap' ? (baseOrder + 3) : (baseOrder + 1);
            const arrowOrder = seg.cls === 'overlap' ? (baseOrder + 4) : (baseOrder + 2);
            const opacity = seg.cls === 'overlap' ? 1.0 : 0.94;

            if(seg.cls === 'overlap') continue;
            const arrowData = getArrowDataOnSegment(seg.points, 0.5, true);
            if(!arrowData) continue;

      }
      const originField = fieldDipoleCausal2D(0, 0);
      if(Math.abs(originField.y) > 1e-8){
        const existingOrigin = xAxisMarkers.find(m => Math.abs(m.x) < 0.03);
        const originEntry = { x:0, cls:'overlap', color:classColorDipole('overlap'), fieldY:originField.y, priority:4 };
        if(existingOrigin) Object.assign(existingOrigin, originEntry);
        else xAxisMarkers.push(originEntry);
      }
      xAxisMarkers.sort((a,b) => a.x - b.x);
      if(state.showFieldArrows){
        for(const marker of xAxisMarkers){
          const added = addFieldVectorArrowOnXAxis(marker.x, marker.fieldY, FIELD_ARROW_COLOR, fieldGroup, baseOrder + 6);
          if(added && added.tip) positiveXAxisArrowTips.push(added.tip.clone());
        }
        if(positiveXAxisArrowTips.length >= 2){

    } else {
      state.fieldArrowTips = [];

      for(const dir of dirs){

        if(b.length() > a.length() + 1e-5){
          fieldGroup.add(makeLine([a,b], signColor, 0.95, baseOrder + 1));
          addSmallArrowOnSegment([a,b], 0.5, signColor, 0.045, fieldGroup, state.source === 'minus', baseOrder + 2);
        }
      }
    }
  });
}
function updateNote(){
  const t = I18N[state.lang] || I18N.el;
  const sourceText = state.source === 'plus' ? t.sourcePlus : state.source === 'minus' ? t.sourceMinus : t.sourceDipoleText;
  const modeText = state.mode === 'appear' ? t.modeAppearText : t.modeDisappearText;
  let extra = '';
  if(state.mode === 'disappear') extra = t.disappearExtra;
  else if(state.mode === 'appear') extra = state.source === 'dipole' ? t.appearDipoleExtra : t.appearMonoExtra;
  if(state.monoRealMotion && state.source !== 'dipole') extra = state.lang === 'en' ? 'The charge motion starts inside the existing propagation. Old emitted line-portions keep their original trajectories; only newer information from the moving source adds new portions where it has arrived.' : 'Η κίνηση ξεκινά μέσα στην ήδη τρέχουσα διάδοση. Τα παλιά τμήματα γραμμών συνεχίζουν στις αρχικές τροχιές τους· μόνο η νεότερη πληροφορία από την κινούμενη πηγή προσθέτει νέα τμήματα όπου έχει φτάσει.';
  const viewText = t.viewText;
  const viewExtra = t.viewExtra;
  note.innerHTML = `<b>${modeText}</b> · ${sourceText}<br><span style="color:#bcc8d8">${extra}</span>`;
}
function animateFrame(dt){
  if(state.playing) advanceTimeline(dt);
  updateCharges();
  updateSensors();
  rebuildField();
  rebuildMonoGraphScene();
  updateCamera();
  updateNote();
  refreshMonoRealUiIfNeeded();
  drawMonoEtGraph();
  renderer.render(scene, activeCamera());
}

function renderStillFrame(){
  const wasPlaying = state.playing;
  state.playing = false;
  animateFrame(0);
  state.playing = wasPlaying;
}
function captureBookSnapshot(){
  renderStillFrame();
  try{
    return renderer.domElement.toDataURL('image/png');
  }catch(err){
    console.warn('Print snapshot failed', err);
    return null;
  }
}
window.getBookPrintSnapshot = captureBookSnapshot;
window.ElectrostaticFieldApp = { getPrintSnapshot:captureBookSnapshot, state };
window.EMWaveApp = window.EMWaveApp || {};
window.EMWaveApp.getPrintSnapshot = captureBookSnapshot;
window.addEventListener('message', event => {
  const data = event.data || {};
  if(data.type !== 'capturePrintSnapshot') return;
  const dataUrl = captureBookSnapshot();
  event.source?.postMessage({type:'hm_print_snapshot', requestId:data.requestId, dataUrl}, '*');
});

ui.sourceRow.addEventListener('click', e => { const b = e.target.closest('button[data-source]'); if(!b) return; switchSource(b.dataset.source); });
ui.modeToggle.addEventListener('click', ()=>{ switchMode(state.mode === 'appear' ? 'disappear' : 'appear'); });
ui.fieldArrowsToggle.addEventListener('click', ()=>{ if(state.source !== 'dipole' && state.monoRealMotion) return; state.showFieldArrows = !state.showFieldArrows; applyButtons(); });
if(ui.viewRow) ui.viewRow.addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if(!b) return; setViewPreset(b.dataset.view); });
ui.btnPlay.addEventListener('click', ()=>{ state.playing = !state.playing; applyButtons(); });
ui.btnStart.addEventListener('click', ()=>{ state.playing = false; resetTimelineForMode(state.mode); applyButtons(); });
ui.btnEnd.addEventListener('click', ()=>{ state.playing = false; const tEnd = state.monoRealMotion ? monoRealMotionEndTime() + (maxTravelDistance + 0.8) / monoRealPropagationSpeed() : (maxTravelDistance + 0.8) / (Math.max(0.006, state.speed * 1.6) * maxRadius); state.clock = Math.max(state.clock, tEnd); applyButtons(); });
ui.btnBack.addEventListener('click', ()=>{ state.playing = false; advanceTimeline(-0.10); applyButtons(); });
ui.btnFwd.addEventListener('click', ()=>{ state.playing = false; advanceTimeline(0.10); applyButtons(); });
if(ui.btnMonoRealMove) ui.btnMonoRealMove.addEventListener('click', runMonoRealMotionTest);
ui.zoomIn.addEventListener('click', ()=>{ state.distance -= 0.55; });
ui.zoomOut.addEventListener('click', ()=>{ state.distance += 0.55; });
ui.speedUp.addEventListener('click', ()=>{ state.speed = Math.min(0.010, +(state.speed + 0.0005).toFixed(4)); applyButtons(); });
ui.speedDown.addEventListener('click', ()=>{ state.speed = Math.max(0.00025, +(state.speed - 0.0005).toFixed(4)); applyButtons(); });
ui.camLeft.addEventListener('click', ()=>{ state.yaw -= 0.16; });
ui.camRight.addEventListener('click', ()=>{ state.yaw += 0.16; });
ui.camUp.addEventListener('click', ()=>{ state.pitch += 0.10; });
ui.camDown.addEventListener('click', ()=>{ state.pitch -= 0.10; });
ui.camReset.addEventListener('click', ()=> setViewPreset('2d'));
ui.langEl.addEventListener('click', ()=>{ state.lang = 'el'; applyButtons(); updateNote(); });
ui.langEn.addEventListener('click', ()=>{ state.lang = 'en'; applyButtons(); updateNote(); });

function panCameraByPixels(dx, dy){
  const w = Math.max(1, stage.clientWidth || 1);
  const h = Math.max(1, stage.clientHeight || 1);
  const worldPerPixelX = (orthoCamera.right - orthoCamera.left) / (orthoCamera.zoom * w);
  const worldPerPixelY = (orthoCamera.top - orthoCamera.bottom) / (orthoCamera.zoom * h);
  cameraPan.x -= dx * worldPerPixelX;
  cameraPan.y += dy * worldPerPixelY;
}
stage.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  state.dragging = true;
  state.dragX = e.clientX;
  state.dragY = e.clientY;
  state.dragStartX = e.clientX;
  state.dragStartY = e.clientY;
  state.dragMoved = false;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if(!state.dragging) return;
  const dx = e.clientX - state.dragX;
  const dy = e.clientY - state.dragY;
  const totalDx = e.clientX - state.dragStartX;
  const totalDy = e.clientY - state.dragStartY;
  if((totalDx * totalDx + totalDy * totalDy) > 16) state.dragMoved = true;
  state.dragX = e.clientX; state.dragY = e.clientY;
  if(state.view === '3d'){
    state.yaw += dx * 0.0065;
    state.pitch += dy * -0.0065;
  } else {
    panCameraByPixels(dx, dy);
  }
});
stage.addEventListener('pointerup', e => {
  const wasClick = !state.dragMoved;
  state.dragging = false;
  try{ stage.releasePointerCapture(e.pointerId); }catch{}
  if(wasClick){
    state.playing = !state.playing;
    applyButtons();
  }
});
stage.addEventListener('pointerleave', ()=>{ state.dragging = false; });
stage.addEventListener('wheel', e => { e.preventDefault(); state.distance += Math.sign(e.deltaY) * 0.45; }, {passive:false});

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  animateFrame(dt);
  requestAnimationFrame(loop);
}

resetTimelineForMode(state.mode);
setViewPreset('2d');
applyButtons();
updateNote();
requestAnimationFrame(loop);
</script>
